<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shlep — Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 6 24 28"><path d="M30 12 C 17 12, 17 20, 24 20 C 31 20, 31 28, 18 28" stroke="%23E0A32E" stroke-width="3.7" stroke-linecap="round" fill="none"/><circle cx="30" cy="12" r="2.7" fill="%23E0A32E"/><circle cx="18" cy="28" r="3.6" fill="%23E0A32E"/></svg>' />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --spruce:#17160F; --pine:#17160F; --moss:#14532D; --terra:#B98114;
    --accent:#E0A32E;
    --marigoldSoft:#F5E5C4; --marigoldText:#8a6510;
    --paper:#F3EFE6; --surface:#FBFAF4; --ink:#17160F; --ink2:#57534A; --ink3:#8a867c;
    --line:rgba(23,22,15,.13); --dash:#C9BFA9;
    --display:'Bricolage Grotesque',sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}
  a{color:inherit;}
  h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-0.5px;}
  .mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;}
  nav{background:rgba(243,239,230,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .navrow{max-width:760px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:inline-flex;align-items:center;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em;color:var(--ink);text-decoration:none;}
  .brand svg{display:block;margin-right:-1px;transform:translateY(1px);}
  .langsw{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;}
  .langsw button{font-family:var(--mono);font-size:11px;letter-spacing:.5px;border:0;background:transparent;color:var(--ink2);padding:5px 9px;border-radius:999px;cursor:pointer;}
  .langsw button.on{background:var(--spruce);color:#fff;}

  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:14px;margin:28px 0 18px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
  .tabs button{font-family:var(--body);font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:9px 16px;border-radius:999px;cursor:pointer;}
  .tabs button.on{background:var(--spruce);color:#fff;border-color:var(--spruce);}

  h1.doctitle{font-size:32px;margin-bottom:6px;}
  .updated{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-bottom:22px;}
  .intro{font-size:17px;color:var(--ink2);margin-bottom:26px;}
  .sec{margin-bottom:22px;}
  .sec h2{font-size:18px;font-family:var(--display);margin-bottom:6px;}
  .sec p{color:var(--ink2);font-size:15.5px;}
  .disclaimer{display:flex;gap:10px;background:var(--marigoldSoft);color:var(--marigoldText);border-radius:14px;padding:16px;margin:30px 0 60px;font-size:14px;}

  footer{background:var(--ink);color:#c8c4ba;margin-top:40px;}
  .footrow{max-width:760px;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;gap:14px 26px;justify-content:space-between;align-items:center;}
  .footlinks{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;}
  .footlinks a{color:#c8c4ba;text-decoration:none;}
  .footlinks a:hover{color:#F3EFE6;}
  .footrights{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:#8a867c;}
</style>
</head>
<body>
<nav>
  <div class="navrow">
    <a class="brand" href="index.html">
      <svg height="22" viewBox="14 8 20 24" fill="none"><path d="M30 12 C 17 12, 17 20, 24 20 C 31 20, 31 28, 18 28" stroke="var(--accent)" stroke-width="3.7" stroke-linecap="round"/><circle cx="30" cy="12" r="2.7" fill="var(--accent)"/><circle cx="18" cy="28" r="3.6" fill="var(--accent)"/></svg><span>hlep</span>
    </a>
    <div class="langsw" id="langsw">
      <button data-lang="de">DE</button>
      <button data-lang="fr">FR</button>
      <button data-lang="it">IT</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</nav>

<div class="wrap">
  <a class="backlink" href="index.html" id="backlink">← Back</a>
  <div class="tabs" id="tabs"></div>
  <article id="doc"></article>
  <div class="disclaimer"><span>ⓘ</span><span id="disclaimer"></span></div>
</div>

<footer>
  <div class="footrow">
    <div class="footlinks">
      <a href="legal.html?doc=terms" data-i18n="foot.terms">AGB</a>
      <a href="legal.html?doc=privacy" data-i18n="foot.privacy">Datenschutz</a>
      <a href="legal.html?doc=impressum" data-i18n="foot.impressum">Impressum</a>
      <a href="kontakt.html" data-i18n="foot.contact">Kontakt</a>
    </div>
    <span class="footrights">© 2026 SHLEP · MADE IN ZÜRICH · CH</span>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="legal.js"></script>
<script>
  function currentDoc() {
    var p = new URLSearchParams(location.search).get('doc');
    return (p === 'privacy' || p === 'impressum') ? p : 'terms';
  }
  var docKey = currentDoc();

  function renderLegal(lang) {
    var ui = window.SHLEP_LEGAL_UI[lang] || window.SHLEP_LEGAL_UI.de;
    var set = window.SHLEP_LEGAL[lang] || window.SHLEP_LEGAL.de;
    var doc = set[docKey];

    document.getElementById('backlink').textContent = '← ' + ui.back;

    // tabs
    var tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    [['terms', ui.terms], ['privacy', ui.privacy], ['impressum', ui.impressum]].forEach(function (t) {
      var b = document.createElement('button');
      b.textContent = t[1];
      if (t[0] === docKey) b.className = 'on';
      b.onclick = function () {
        docKey = t[0];
        history.replaceState(null, '', 'legal.html?doc=' + t[0]);
        renderLegal(document.documentElement.lang || lang);
      };
      tabs.appendChild(b);
    });

    // body
    var wrap = document.getElementById('doc');
    var html = '<h1 class="doctitle">' + doc.title + '</h1>';
    html += '<div class="updated">' + ui.updated + ': ' + window.SHLEP_LEGAL_UPDATED + '</div>';
    html += '<p class="intro">' + doc.intro + '</p>';
    doc.sections.forEach(function (s) {
      html += '<div class="sec"><h2>' + s.h + '</h2><p>' + s.p + '</p></div>';
    });
    wrap.innerHTML = html;
    document.getElementById('disclaimer').textContent = ui.disclaimer;
    document.title = 'Shlep — ' + doc.title;
  }

  // i18n.js calls this after a language switch
  function onLangApplied(lang) { renderLegal(lang); }

  applyLang(getLang());
</script>
</body>
</html>
